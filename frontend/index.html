<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="orb-canvas"></canvas>

    <!-- Minimal controls — top right -->
    <div id="controls">
      <button id="btn-mute" title="Mute/Unmute" data-i18n-title>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button id="btn-menu" title="Menu" data-i18n-title>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>

    <!-- Dropdown menu -->
    <div id="menu-dropdown" style="display:none">
      <button id="btn-settings" data-i18n>Settings</button>
      <a id="link-admin" href="/admin.html" data-i18n>Admin</a>
      <button id="btn-restart" data-i18n>Restart Server</button>
      <button id="btn-fix-self" data-i18n>Fix Yourself</button>
    </div>

    <!-- The microphone switch: large and always on screen, not in the menu.
         Its state is the label (LISTENING / MUTE) and aria-pressed. -->
    <button id="mute-toggle" type="button" aria-pressed="false"
            title="Mute or unmute the microphone (M)" aria-label="Microphone"
            data-i18n-title data-i18n-aria-label>
      <span class="mute-dot" aria-hidden="true"></span>
      <span id="mute-label">LISTENING</span>
    </button>

    <div id="status-text"></div>
    <div id="jarvis-label">JARVIS</div>
    <div id="error-text"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
