# Run the suite on every push and pull request.
#
# macOS, not Ubuntu, on purpose: JARVIS is a macOS-only project, and while
# every macOS-specific subprocess (osascript, screencapture, sips, claude) is
# faked at the seam in tests, the environment the suite was written against
# is a Mac. A green run here means what a green run on the author's machine
# means. Ubuntu would be cheaper and would also be a second environment
# nobody develops on.
#
# The suite needs: Python 3.11+ (the code uses `X | None` at runtime; 3.9,
# which macOS ships as `python3`, dies at import), Node for the frontend
# build that tests/test_dashboard_page.py drives, and Playwright's Chromium
# for the same test plus read_page / look_at_page. It does NOT need a Fish
# Audio key, a Claude login, or the network: `pytest.ini` deselects the nine
# browser-integration tests, and everything else runs offline.

name: tests

on:
  # Una rama con PR abierto se prueba una vez (pull_request), no dos (push +
  # pull_request): con macOS en cola cada ejecución duplicada cuesta minutos.
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Ubuntu is the jarvis-ubuntu port; macOS stays the upstream reference.
    # Both must be green.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Test suite
        env:
          JARVIS_BRAIN_AUTOSTART: "0"
        run: pytest -v -o faulthandler_timeout=300 -p no:cacheprovider

  # Pruebas de extremo a extremo: Chromium y Firefox de verdad contra un
  # servidor JARVIS de verdad (tests/e2e/). Solo en Ubuntu: los navegadores de
  # Playwright y su audio falso son los mismos en cualquier sistema y el job de
  # macOS ya es el más lento de la cola. No hay Whisper ni `claude`: el
  # transcriptor y el cerebro son falsos (ver tests/e2e/server_runner.py).
  # JARVIS_E2E_STRICT=1 convierte lo que falte (navegador, bundle) en un fallo
  # en vez de un salto silencioso.
  e2e:
    name: e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JARVIS_E2E_STRICT: "1"
      JARVIS_BRAIN_AUTOSTART: "0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Playwright Chromium and Firefox
        run: python -m playwright install --with-deps chromium firefox

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: End-to-end tests
        run: pytest tests/e2e -m e2e -v -o faulthandler_timeout=300 -p no:cacheprovider

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
